# 一键部署：docker compose up -d --build
# 前置：服务器需安装 Docker 和 Docker Compose 插件
services:
  # 前端：Vite 构建 + nginx 托管静态文件 + 反代 /api
  web:
    build: .
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  # 后端：FastAPI + uvicorn
  api:
    build: ./backend
    environment:
      # 默认连 compose 内置的 postgres；如要直连宿主机上已有的 PostgreSQL，
      # 改为：postgresql+psycopg://用户名:密码@宿主机IP:5432/库名
      # 宿主机IP 不能写 127.0.0.1（容器内指向自己），可用服务器内网IP
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ginyear}:${POSTGRES_PASSWORD:-ginyear}@db:5432/${POSTGRES_DB:-ginyear}
    depends_on:
      - db
    restart: unless-stopped

  # 数据库：PostgreSQL（数据存 named volume，容器重建不丢）
  # 如果你想直接用服务器上已有的 PostgreSQL，删掉本服务即可
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ginyear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ginyear}
      POSTGRES_DB: ${POSTGRES_DB:-ginyear}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # 如需从宿主机访问数据库做管理，放开端口映射：
    # ports:
    #   - "127.0.0.1:5432:5432"

volumes:
  pgdata:
