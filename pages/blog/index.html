<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客 · 小杰的杂物间</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/header.css">
    <link rel="stylesheet" href="../../assets/css/main-card.css">
    <link rel="stylesheet" href="../../assets/css/sidebar.css">
    <link rel="stylesheet" href="../../assets/css/footer.css">
    <link rel="stylesheet" href="../../assets/css/modal.css">
    <link rel="stylesheet" href="../../assets/css/blog-posts.css">
</head>
<body data-page="blog">
    <!-- 公共布局（header/移动菜单/登录框）由 src/js/components/layout.js 注入 -->
    <div id="layout-header"></div>

    <main class="main">
        <div class="main-card">
            <h2><i class="fas fa-newspaper"></i> 博客</h2>

            <!-- 文章列表：简略信息卡片，由 src/js/blog.js 渲染，点击进入详情页 -->
            <div id="blog-list"></div>
            <button type="button" class="moment-more" id="blog-more" style="display: none;">加载更多</button>

            <p style="margin-top: 1.25rem; text-align: right;">
                <!-- 仅站长登录后由 src/js/blog.js 显示 -->
                <a href="./write.html" id="blog-write-link" style="display: none;"><i class="fas fa-pen-nib"></i> 写博客</a>
            </p>
        </div>
        <!-- 公共侧栏由 src/js/components/layout.js 注入 -->
        <div id="layout-sidebar"></div>
    </main>

     <div style="height: 6.25rem;"></div>
    <!-- 公共页脚由 src/js/components/layout.js 注入 -->
    <div id="layout-footer"></div>
    <script src="/vendors/lunar-javascript-1.7.3/lunar.js"></script>
    <script type="module" src="/src/js/pages/blog.js"></script>
</body>
</html>
