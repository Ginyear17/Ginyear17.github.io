<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相册 · 小杰的杂物间</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/header.css">
    <link rel="stylesheet" href="../../assets/css/main-card.css">
    <link rel="stylesheet" href="../../assets/css/sidebar.css">
    <link rel="stylesheet" href="../../assets/css/footer.css">
    <link rel="stylesheet" href="../../assets/css/modal.css">
    <link rel="stylesheet" href="../../assets/css/moments.css">
    <link rel="stylesheet" href="../../assets/css/album.css">

</head>
<body data-page="album">
    <!-- 公共布局（header/移动菜单/登录框）由 src/js/components/layout.js 注入 -->
    <div id="layout-header"></div>

    <main class="main">
        <div class="main-card">
            <h2><i class="fas fa-images"></i> 相册</h2>

            <!-- 工具栏：新建相册（登录后显示） -->
            <div class="album-toolbar" id="album-toolbar"></div>

            <!-- 相册卡片网格 -->
            <div id="album-grid" class="album-grid"></div>

            <!-- 相册详情（照片墙），点卡片后切换显示 -->
            <div id="album-detail" style="display: none;">
                <button type="button" class="album-back" id="album-back">
                    <i class="fas fa-angle-left"></i> 返回相册列表
                </button>
                <div class="album-detail-head">
                    <div>
                        <h3 id="album-detail-title"></h3>
                        <p id="album-detail-desc" class="album-desc"></p>
                    </div>
                    <div class="album-detail-actions" id="album-detail-actions"></div>
                </div>
                <div id="photo-grid" class="photo-grid"></div>
            </div>
        </div>
        <!-- 公共侧栏由 src/js/components/layout.js 注入 -->
        <div id="layout-sidebar"></div>
    </main>

     <div style="height: 6.25rem;"></div>
    <!-- 公共页脚由 src/js/components/layout.js 注入 -->
    <div id="layout-footer"></div>
    <script src="/vendors/lunar-javascript-1.7.3/lunar.js"></script>
    <script type="module" src="/src/js/pages/album.js"></script>
</body>
