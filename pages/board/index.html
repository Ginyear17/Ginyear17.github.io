<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 · 小杰的杂物间</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/header.css">
    <link rel="stylesheet" href="../../assets/css/main-card.css">
    <link rel="stylesheet" href="../../assets/css/sidebar.css">
    <link rel="stylesheet" href="../../assets/css/footer.css">
    <link rel="stylesheet" href="../../assets/css/modal.css">
    <link rel="stylesheet" href="../../assets/css/board.css">
</head>

<body data-page="board">
    <!-- 公共布局（header/移动菜单/登录框）由 src/js/components/layout.js 注入 -->
    <div id="layout-header"></div>

    <main class="main">
        <div class="main-card">
            <h2><i class="fas fa-comments"></i> 留言板</h2>

            <!-- 发布留言 -->
            <form id="message-form" class="message-form">
                <div class="form-row">
                    <input type="text" id="msg-name" placeholder="昵称（留空则显示“匿名”）" maxlength="50">
                </div>
                <textarea id="msg-content" placeholder="说点什么吧...（500 字以内）" maxlength="500" required></textarea>
                <button type="submit">发布留言</button>
            </form>

            <!-- 留言列表 -->
            <div class="message-total" id="message-total"></div>
            <div id="message-list"></div>
        </div>
        <!-- 公共侧栏由 src/js/components/layout.js 注入 -->
        <div id="layout-sidebar"></div>
    </main>

    <div style="height: 100px;"></div>
    <!-- 公共页脚由 src/js/components/layout.js 注入 -->
    <div id="layout-footer"></div>
    <script src="/vendors/lunar-javascript-1.7.3/lunar.js"></script>
    <script type="module" src="/src/js/pages/board.js"></script>
</body>
