<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>说说详情 · 拾光小筑</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/header.css">
    <link rel="stylesheet" href="../../assets/css/main-card.css">
    <link rel="stylesheet" href="../../assets/css/sidebar.css">
    <link rel="stylesheet" href="../../assets/css/footer.css">
    <link rel="stylesheet" href="../../assets/css/modal.css">
    <link rel="stylesheet" href="../../assets/css/moments.css">
</head>

<body data-page="moments-detail">
    <!-- 公共布局（header/移动菜单/登录框）由 src/js/components/layout.js 注入 -->
    <div id="layout-header"></div>

    <main class="main">
        <div class="main-card">
            <h2><i class="fas fa-feather"></i> 说说</h2>

            <!-- 单条说说由 initMomentDetail 按 ?id= 渲染 -->
            <div id="moment-detail"></div>

            <!-- 评论区由 initMomentComments 渲染 -->
            <div class="moment-comment-section" id="moment-comments">
                <h3 class="comment-title"><i class="fas fa-comments"></i> 评论 <span id="comment-count"></span></h3>

                <form id="comment-form" class="comment-form">
                    <input type="text" id="comment-name" placeholder="昵称（留空则显示「匿名」）" maxlength="50">
                    <textarea id="comment-content" placeholder="说点什么吧...（500 字以内）" maxlength="500" required></textarea>
                    <button type="submit">发表评论</button>
                </form>

                <div id="comment-list"></div>
            </div>
        </div>
        <!-- 公共侧栏由 src/js/components/layout.js 注入 -->
        <div id="layout-sidebar"></div>
    </main>

    <div style="height: 6.25rem;"></div>
    <!-- 公共页脚由 src/js/components/layout.js 注入 -->
    <div id="layout-footer"></div>
    <script src="/vendors/lunar-javascript-1.7.3/lunar.js"></script>
    <script type="module" src="/src/js/pages/moments.js"></script>
</body>

</html>
