<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小杰的杂物间</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/header.css">
    <link rel="stylesheet" href="./assets/css/main-card.css">
    <link rel="stylesheet" href="./assets/css/sidebar.css">
    <link rel="stylesheet" href="./assets/css/footer.css">
    <link rel="stylesheet" href="./assets/css/slider.css">
    <link rel="stylesheet" href="./assets/css/blog-posts.css">
    <link rel="stylesheet" href="./assets/css/modal.css">
    <link rel="stylesheet" href="./assets/css/click-appears.css">

</head>
<body data-page="home">
    <!-- 公共布局（header/移动菜单/登录框）由 src/js/components/layout.js 注入 -->
    <div id="layout-header"></div>

    <main class="main">
        <div class="main-card">
            <!-- Slider -->
            <div class="slider">
                <div class="slide active">
                    <img src="./assets/images/album/时光小憩.JPG" alt="时光小憩" class="slide-img">
                    <div class="slide-content">
                        <h2 class="slide-title"></h2>
                        <p class="slide-subtitle"></p>
                        <a href="/" class="slide-link"><i class="fas fa-arrow-right"></i></a>
                    </div>
                </div>
                
                <div class="slide">
                    <img src="./assets/images/album/IMG_20240210_174111.jpg" alt="螺洲古镇日落" class="slide-img">
                    <div class="slide-content">
                        <h2 class="slide-title"></h2>
                        <p class="slide-subtitle"></p>
                        <a href="/" class="slide-link"><i class="fas fa-arrow-right"></i></a>
                    </div>
                </div>
                
                <div class="slide">
                    <img src="./assets/images/album/IMG_20230815_121415.jpg" alt="白云" class="slide-img">
                    <div class="slide-content">
                        <h2 class="slide-title"></h2>
                        <p class="slide-subtitle"></p>
                        <a href="/" class="slide-link"><i class="fas fa-arrow-right"></i></a>
                    </div>
                </div>
                
                <div class="slide">
                    <img src="./assets/images/album/IMG_20230820_183148.jpg" alt="烟台山小店" class="slide-img">
                    <div class="slide-content">
                        <h2 class="slide-title"></h2>
                        <p class="slide-subtitle"></p>
                        <a href="/" class="slide-link"><i class="fas fa-arrow-right"></i></a>
                    </div>
                </div>

                <div class="slide">
                    <img src="./assets/images/album/IMG_20241202_173347.jpg" alt="建发楼日落" class="slide-img">
                    <div class="slide-content">
                        <h2 class="slide-title"></h2>
                        <p class="slide-subtitle"></p>
                        <a href="/" class="slide-link"><i class="fas fa-arrow-right"></i></a>
                    </div>
                </div>
                
                <!-- Slider Controls -->
                <button class="slider-control slider-prev">
                <i class="fas fa-chevron-left"></i>
                </button>
                <button class="slider-control slider-next">
                <i class="fas fa-chevron-right"></i>
                </button>
                
                <!-- Slider Dots -->
                <div class="slider-dots">
                <span class="slider-dot active" data-index="0"></span>
                <span class="slider-dot" data-index="1"></span>
                <span class="slider-dot" data-index="2"></span>
                <span class="slider-dot" data-index="3"></span>
                <span class="slider-dot" data-index="4"></span>
                </div>
            </div>
            
            <!-- Blog Posts：最新博客卡片，由 src/js/blog.js 的 initHomeBlogs 从后端渲染，点击进入详情页 -->
            <div class="blog-section">
                <h2 class="blog-section-title"><i class="fas fa-newspaper"></i>最新动态</h2>
                <div id="home-blog-list"></div>

                <a href="/pages/blog/index.html" class="load-more" style="text-decoration: none;">查看更多</a>
            </div>
        </div>
        <!-- 公共侧栏由 src/js/components/layout.js 注入 -->
        <div id="layout-sidebar"></div>
    </main>

    <div style="height: 6.25rem;"></div>
    <!-- 公共页脚由 src/js/components/layout.js 注入 -->
    <div id="layout-footer"></div>
    <script src="/vendors/lunar-javascript-1.7.3/lunar.js"></script>
    <script type="module" src="/src/js/pages/home.js"></script>
</body>
</html>
